# Orbit Lab — PHP (OpenLiteSpeed) + WordPress (app only; DB from OrbitLab shared MySQL)
# Use: docker compose -f docker-compose.litespeed.yml up -d
# Set MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD in .env (from POST /database or external MySQL). See .env.example.

services:
  openlitespeed:
    build: .
    image: orbitlab-wordpress-openlitespeed
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ols_sites:/usr/local/lsws/sites
      - ols_logs:/usr/local/lsws/logs
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${WEBADMIN_PORT:-7080}:7080"

volumes:
  ols_sites:
  ols_logs:
