# Orbit Lab — PHP (Apache) + WordPress, app only (no DB container).
# Use with OrbitLab shared MySQL: set MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD in .env (from POST /database response).
# Use: docker compose -f docker-compose.apache-app-only.yml up -d

services:
  apache:
    build: .
    image: orbitlab-wordpress-apache
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${HTTP_PORT:-8080}:80"
