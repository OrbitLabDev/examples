# Orbit Lab — PHP (Apache) + WordPress (app only; DB from OrbitLab shared MySQL)
# Use: docker compose -f docker-compose.apache.yml up -d
# Set MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD in .env (from POST /database or external MySQL). See .env.example.

services:
  apache:
    build: .
    image: orbitlab-wordpress-apache
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${HTTP_PORT:-8080}:80"
